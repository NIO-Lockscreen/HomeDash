# Keeps the HomeDash TV album in step with the calendar, once an hour.
#
# Vercel Hobby only allows cron jobs that run once a day, so the hourly tick
# comes from here instead (free on a public repository). vercel.json keeps a
# daily Vercel cron as a fallback, so the date still rolls over if GitHub
# ever pauses this schedule (it does so after 60 days without a commit).
#
# An hour in which nothing changed costs HomeDash no Blob operation: the
# endpoint answers from two CDN-cached files and stops.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#   HOMEDASH_URL  e.g. https://your-project.vercel.app
#   CRON_SECRET   the same value as CRON_SECRET in Vercel
name: HomeDash TV (hourly)

on:
  schedule:
    # Minute 17, not 0: GitHub delays runs at the top of the hour the most.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: homedash-tv
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Update the TV album
        env:
          HOMEDASH_URL: ${{ secrets.HOMEDASH_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$HOMEDASH_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::Add the HOMEDASH_URL and CRON_SECRET repository secrets to switch the hourly TV update on."
            exit 0
          fi
          # A big change (the first sync, a busy week) can take more than one
          # 60-second run; the endpoint says "more": true until it is done.
          for run in 1 2 3 4 5 6; do
            body=$(curl -sS --fail-with-body --max-time 75 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "${HOMEDASH_URL%/}/api/tv/refresh") || { echo "$body"; exit 1; }
            echo "$body"
            echo "$body" | grep -q '"more":true' || break
          done
          # A failure is reported once. While the endpoint is backing off (or
          # waiting for Google Photos to be connected again) the run stays
          # green, so a broken connection does not send an email every hour.
          if echo "$body" | grep -q '"ok":false' && ! echo "$body" | grep -q '"skipped":"backing off"'; then
            echo "::error::The TV update failed. Open /tv.html on HomeDash for details."
            exit 1
          fi
